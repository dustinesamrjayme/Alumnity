<!-- events.page.html -->
<ion-content>
  <div class="main">
    <div class="eyebrow">Event staff</div>
    <h1 class="title">Events</h1>
    <p class="sub">Pick an event to scan attendees or view the check-in list.</p>
    <div class="search">
      <input placeholder="Search events" (input)="q.set($any($event.target).value)" />
    </div>

    @for (e of list(); track e.id) {
      <article class="card event-card">
        <div class="event-cover"
             [class.green]="(e.id | eventTheme) === 'green'"
             [class.sky]="(e.id | eventTheme) === 'sky'">
          <span class="pill" [class.green]="(e.id | eventTheme) === 'green'">
            {{ e.event_date | dateLabel }}
          </span>
        </div>
        <div class="event-content">
          <h2 class="event-title">{{ e.name }}</h2>
          <div class="event-meta">
            <span>⌖ {{ e.venue }}</span>
            <span>{{ e.status === 'listed' ? 'Open' : 'Closed' }}</span>
            <span>{{ e.price | feeLabel }}</span>
          </div>
          <div class="event-bottom">
            <a class="btn primary grow" [routerLink]="['/volunteer/scanner', e.id]">Scan</a>
            <a class="btn outline grow" [routerLink]="['/volunteer/attendees', e.id]">Attendees</a>
          </div>
        </div>
      </article>
    } @empty {
      <div class="empty">No events to scan.</div>
    }
  </div>
</ion-content>
