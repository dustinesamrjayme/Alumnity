<!-- past-events.page.html -->
<ion-content>
  <div class="main past-page">
    <a class="back" routerLink="/admin/events">← Manage events</a>
    <div class="eyebrow">Archive</div>
    <h1 class="title">Past events</h1>
    <p class="sub">Closed events and attendance summaries.</p>

    <div class="past-grid">
      @for (r of rows(); track r.id) {
        <div class="card chart">
          <div class="row between top">
            <div class="meta">
              <h2 class="event-title">{{ r.name }}</h2>
              <p class="small">{{ r.event_date | dateLabel }} · {{ r.venue }}</p>
            </div>
            <span class="pill pf">Closed</span>
          </div>
          <div class="stats">
            <div><span class="small">Registered</span><strong>{{ r.registered }}</strong></div>
            <div><span class="small">Checked in</span><strong>{{ r.checked_in }}</strong></div>
          </div>
          <div class="bar" role="img"
               [attr.aria-label]="r.checked_in + ' of ' + r.registered + ' registrants checked in'">
            <i [style.width.%]="r.fillPct"></i>
          </div>
        </div>
      } @empty {
        <div class="card empty"><p class="small">No past events yet.</p></div>
      }
    </div>
  </div>
</ion-content>
