<app-header />
<ion-content>
  <div class="main past-page">
    <a class="back" routerLink="/admin/events">← Manage events</a>
    <div class="eyebrow">Archive</div>
    <h1 class="title">Past events</h1>
    <p class="sub">Closed events and attendance summaries.</p>

    <div class="past-grid">
      @for (e of store.pastEvents; track e.id) {
        <div class="card chart">
          <div class="row between top">
            <div class="meta">
              <h2 class="event-title">{{ e.title }}</h2>
              <p class="small">{{ e.dateLabel }} · {{ e.venue }}</p>
            </div>
            <span class="pill pf">Closed</span>
          </div>

          <div class="stats">
            <div><span class="small">Registered</span><strong>{{ e.registered }}</strong></div>
            <div><span class="small">Checked in</span><strong>{{ e.checkedIn }}</strong></div>
          </div>

          <div class="bar" role="img"
               [attr.aria-label]="e.checkedIn + ' of ' + e.registered + ' registrants checked in'">
            <i [style.width.%]="e.registered ? (e.checkedIn / e.registered) * 100 : 0"></i>
          </div>
        </div>
      } @empty {
        <div class="card empty">
          <p class="small">No past events yet.</p>
        </div>
      }
    </div>
  </div>
</ion-content>
